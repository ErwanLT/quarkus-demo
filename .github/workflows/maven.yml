name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Une push qui en remplace une autre annule le build précédent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.domain }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # Un domaine en échec ne doit pas masquer les résultats des autres.
      fail-fast: false
      matrix:
        domain:
          - core-concept
          - web-concept
          - operations
          - database-access
          - integration

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        # Depuis la v6, le problem matcher Java est désactivé par défaut :
        # on le réactive pour garder les annotations sur les pull requests.
        problem-matcher: true
    - name: Build and run tests (${{ matrix.domain }})
      # -pl <domaine> -amd : sélectionne le POM d'agrégation du domaine puis,
      # par dépendance de parenté, tous ses modules. Le build natif GraalVM
      # n'est volontairement pas exécuté ici.
      run: ./mvnw -B -pl "${{ matrix.domain }}" -amd verify

  extension:
    name: quarkus-taverne-extension
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        problem-matcher: true
    - name: Build and test the detached extension
      # Cette arborescence n'a pas de parent vers le POM racine : elle doit
      # être construite séparément, avec ses propres tests (QuarkusUnitTest).
      run: ./mvnw -B -f operations/quarkus-taverne-extension/pom.xml clean install
