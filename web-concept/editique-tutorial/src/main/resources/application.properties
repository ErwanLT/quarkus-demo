# Les .jrxml de src/main/jasperreports sont compilés en .jasper au build (valeurs par défaut de l'extension)
# et déposés sur le classpath dans jasperreports/.
quarkus.jasperreports.build.source=src/main/jasperreports
quarkus.jasperreports.build.destination=jasperreports

# Base des URL encodées dans les QR codes.
# Pour scanner depuis un téléphone, surchargez-la avec l'IP LAN du poste :
#   TAVERNE_URL_PUBLIQUE=http://192.168.1.42:8080
taverne.url-publique=${TAVERNE_URL_PUBLIQUE:http://localhost:8080}

# En mode dev, Quarkus n'écoute que sur localhost : on l'ouvre au réseau local
# pour pouvoir scanner les QR codes depuis un téléphone (c'est déjà le défaut en prod).
%dev.quarkus.http.host=0.0.0.0
