quarkus.application.name=scheduler-tutorial
quarkus.http.port=8089
quarkus.swagger-ui.always-include=true

# Les cadences des corvées sont de la configuration : on les change sans recompiler.
# Le cron utilise la syntaxe Quartz par défaut (secondes en premier).
corvees.pression.every=10m
corvees.verres.every=1h
corvees.comptoir.every=30s
corvees.balayage.cron=0 30 6 * * ?
corvees.batch.cron=0 0 3 * * ?
