# Delais raccourcis pour garder la suite de tests rapide et deterministe
taverne.cuisine.timeout=300ms
taverne.voliere.traitement-ms=10

# Surcharge du @Timeout declaratif de GrimoireService (MicroProfile Fault Tolerance)
fr.eletutour.tavern.flammes.grimoire.GrimoireService/recupererRecette/Timeout/value=300
fr.eletutour.tavern.flammes.grimoire.GrimoireService/recupererRecette/Retry/delay=20

quarkus.shutdown.timeout=5s
# Pas de sas de pre-arret en test : on ne veut pas rallonger chaque arret
quarkus.shutdown.delay-enabled=false
taverne.voliere.vidange-max=2s
