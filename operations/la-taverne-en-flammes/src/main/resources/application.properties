quarkus.application.name=la-taverne-en-flammes
quarkus.http.port=8086

# --- 1. Arret gracieux -------------------------------------------------------
# Temps accorde aux requetes en cours avant l'arret force de l'application
quarkus.shutdown.timeout=30s
# Sas de pre-arret : pendant ce delai l'application sert encore normalement mais
# la sonde de readiness repond DOWN, le temps que l'orchestrateur la sorte du
# routage. Attention : delay est ignore si delay-enabled n'est pas explicitement
# a true. Sans ce sas, Quarkus attend bien la fin des requetes en cours mais
# continue d'accepter les nouvelles pendant tout l'arret.
quarkus.shutdown.delay-enabled=true
quarkus.shutdown.delay=3s

# Temps que l'observateur d'arret accorde a la voliere pour finir ses plis
taverne.voliere.vidange-max=10s

# --- 2. Sondes de sante ------------------------------------------------------
# /q/health, /q/health/live, /q/health/ready et l'UI /q/health-ui
quarkus.smallrye-health.ui.always-include=true

# --- 3. Timeouts -------------------------------------------------------------
# Limite d'attente de la cuisine reactive (chaine Mutiny)
taverne.cuisine.timeout=2s

# --- 4. Vidange des corbeaux messagers --------------------------------------
# Canal in-VM : aucun broker requis, la mecanique de vidange reste celle de
# SmallRye Reactive Messaging. Duree de lecture d'un pli, volontairement lente
# pour rendre le retard visible.
taverne.voliere.traitement-ms=200

# --- 5. Persistance ---------------------------------------------------------
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:taverne_en_flammes
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
# Timeout par defaut des transactions (en secondes)
quarkus.transaction-manager.default-transaction-timeout=10

# --- 6. Runbook -------------------------------------------------------------
# Metriques Micrometer/Prometheus sur /q/metrics (pool Agroal inclus)
quarkus.datasource.metrics.enabled=true
quarkus.datasource.jdbc.enable-metrics=true

quarkus.log.console.format=%d{HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n
