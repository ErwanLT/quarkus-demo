# Le commis travaille seul et de nuit : pas besoin de vitrine.
quarkus.banner.enabled=false

# Un commis silencieux qui ne repond que sur convocation explicite,
# pas un serveur qui garde la taverne ouverte en permanence.
quarkus.picocli.top-command=fr.eletutour.taverne.commis.CommisDeCourseCommand

# Niveau de log sobre : le rapport de mission se lit dans la console,
# pas dans un roman fleuve.
quarkus.log.level=INFO
quarkus.log.console.format=%d{HH:mm:ss} %-5p [commis] %s%n
