quarkus.http.port=8088
quarkus.swagger-ui.always-include=true

# Adresse de la Guilde, surchargeable par variable d'environnement.
# Le configKey "guilde" de @RegisterRestClient pointe sur ce préfixe.
quarkus.rest-client.guilde.url=${GUILDE_URL:http://localhost:8088}
quarkus.rest-client.guilde.connect-timeout=1000
quarkus.rest-client.guilde.read-timeout=2000

# Adresse du Grimoire pour le client construit programmatiquement.
taverne.grimoire.url=${GRIMOIRE_URL:http://localhost:8088}

# En dev, on voit passer les requêtes sortantes du coursier dans les logs.
%dev.quarkus.rest-client.logging.scope=request-response
%dev.quarkus.rest-client.logging.body-limit=2048

# En test, l'application écoute sur le port de test : les clients doivent
# pointer dessus, pas sur le port de dev.
%test.quarkus.http.test-port=8081
%test.quarkus.rest-client.guilde.url=http://localhost:8081
%test.taverne.grimoire.url=http://localhost:8081
