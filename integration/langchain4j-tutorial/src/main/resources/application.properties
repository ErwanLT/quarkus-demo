quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:oracle_db;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Modèle local ; installer Ollama puis télécharger le modèle choisi.
quarkus.langchain4j.ollama.base-url=http://localhost:11434
quarkus.langchain4j.ollama.chat-model.model-id=${OLLAMA_MODEL:qwen2.5:7b}
quarkus.langchain4j.ollama.chat-model.temperature=0.2
quarkus.langchain4j.ollama.timeout=120s

%dev.quarkus.http.port=8087
%test.quarkus.langchain4j.ollama.devservices.enabled=false
