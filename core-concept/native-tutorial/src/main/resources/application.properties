# Le barde figé dans la pierre : compilation native avec Quarkus et GraalVM
quarkus.smallrye-openapi.info-title=Taverne - Le barde fige dans la pierre
quarkus.smallrye-openapi.info-version=1.0.0

# === Ecueil n°2 : les parchemins oubliés ===
# Sans cette ligne, les fichiers lus avec getResourceAsStream ne sont pas embarqués dans le binaire.
quarkus.native.resources.includes=ballades/**

# === Ecueil n°3 : la date figée dans le socle ===
# Quarkus initialise les classes applicatives au build : un champ static final y est calculé une fois pour toutes.
# On demande à GraalVM de reporter l'initialisation du Sculpteur au démarrage du binaire.
quarkus.native.additional-build-args=--initialize-at-run-time=fr.eletutour.tavern.barde.statue.Sculpteur
