# Configuration de l'ardoise magique (quarkus-cache)

# === Taille et expiration du cache ===
# L'ardoise peut mémoriser au maximum 100 menus distincts.
# Au-delà, les entrées les plus anciennes sont effacées automatiquement (LRU).
quarkus.cache.caffeine."ardoise-menu".maximum-size=100

# Chaque entrée inscrite sur l'ardoise expire après 10 minutes.
# Après expiration, le prochain appel redescendra automatiquement à la cave.
quarkus.cache.caffeine."ardoise-menu".expire-after-write=10M

# === Logging pour observer le comportement ===
quarkus.log.category."fr.eletutour".level=INFO

# === OpenAPI ===
quarkus.smallrye-openapi.info-title=Taverne - Ardoise Magique
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Démonstration de quarkus-cache avec la métaphore de l'ardoise magique
